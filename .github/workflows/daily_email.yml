name: Envio Diário de E-mails

on:
  schedule:
    # Executa todos os dias às 09:00 UTC (ajuste conforme necessário)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite execução manual para testes

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de envio
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # RECIPIENTS_API_URL: ${{ secrets.RECIPIENTS_API_URL }}
        run: python main.py
